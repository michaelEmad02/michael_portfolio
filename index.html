<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Michael Emad - Flutter Developer specializing in cross-platform mobile apps, enterprise SaaS, and ERP systems.">
  <meta name="author" content="Michael Emad">

  <!-- Open Graph / Facebook / LinkedIn / WhatsApp -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Michael Emad | Flutter Developer">
  <meta property="og:description" content="Portfolio of Michael Emad - Flutter Developer specializing in cross-platform mobile apps, enterprise SaaS, and ERP systems.">
  <meta property="og:image" content="https://res.cloudinary.com/v3hxdb7o/image/upload/v1789214648/me.webp">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Michael Emad | Flutter Developer">
  <meta name="twitter:description" content="Portfolio of Michael Emad - Flutter Developer specializing in cross-platform mobile apps, enterprise SaaS, and ERP systems.">
  <meta name="twitter:image" content="https://res.cloudinary.com/v3hxdb7o/image/upload/v1789214648/me.webp">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Michael Emad">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <meta name="theme-color" content="#0F1418">
  <meta name="color-scheme" content="dark">

  <!-- Preconnect to CDNs to speed up engine & font downloads -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://res.cloudinary.com">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Michael Emad | Flutter Developer</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Prevent any white flash before CSS loads */
    html, body {
      background-color: #0F1418 !important;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", sans-serif;
    }

    /* Branded Splash / Loading Screen */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0F1418;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.5s ease;
      user-select: none;
      -webkit-user-select: none;
    }

    #splash-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .avatar-container {
      position: relative;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-glow {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #38BDF8, #818CF8, #38BDF8);
      animation: spin-glow 3s linear infinite;
      filter: blur(8px);
      opacity: 0.7;
    }

    .avatar-img {
      position: relative;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(56, 189, 248, 0.6);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      background-color: #1B2024;
      z-index: 1;
    }

    .splash-title {
      color: #DEE3E8;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin: 0;
      padding: 0;
    }

    .splash-subtitle {
      color: #38BDF8;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 6px;
      margin-bottom: 24px;
      opacity: 0.9;
    }

    /* Modern loading progress bar */
    .progress-track {
      width: 140px;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 45%;
      background: linear-gradient(90deg, #38BDF8, #818CF8);
      border-radius: 99px;
      animation: indeterminate 1.4s ease-in-out infinite;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }

    @keyframes indeterminate {
      0% {
        left: -40%;
        width: 30%;
      }
      50% {
        left: 30%;
        width: 60%;
      }
      100% {
        left: 100%;
        width: 30%;
      }
    }

    @keyframes spin-glow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Seamless Dark Splash Screen to eliminate white flash & show instant feedback -->
  <div id="splash-screen">
    <div class="splash-content">
      <div class="avatar-container">
        <div class="avatar-glow"></div>
        <img 
          class="avatar-img" 
          src="https://res.cloudinary.com/v3hxdb7o/image/upload/c_fill,w_180,h_180,g_face,r_max,q_auto,f_auto/v1789214648/me.webp" 
          alt="Michael Emad"
          onerror="this.style.display='none'"
        >
      </div>
      <div class="splash-title">Michael Emad</div>
      <div class="splash-subtitle">Flutter Developer</div>
      <div class="progress-track">
        <div class="progress-bar"></div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      var loader = document.getElementById('splash-screen');
      function hideLoader() {
        if (!loader || loader.classList.contains('fade-out')) return;
        loader.classList.add('fade-out');
        setTimeout(function() {
          if (loader && loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 500);
      }

      // 1. Primary event: Flutter paints the first frame
      window.addEventListener('flutter-first-frame', hideLoader);

      // 2. Secondary fallback: Check for Flutter DOM view injection
      var observer = new MutationObserver(function() {
        if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane')) {
          setTimeout(hideLoader, 250);
          observer.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });

      // 3. Fail-safe timeout (never stay stuck indefinitely)
      setTimeout(hideLoader, 8000);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
